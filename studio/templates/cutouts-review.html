<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>174 · Revisão de recortes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17171b;color:#f3f0ea;font:16px system-ui}main{max-width:1500px;margin:auto;padding:24px}h1{margin-bottom:8px}p{line-height:1.5;color:#ccc}nav{position:sticky;top:0;padding:12px;background:#17171bef;z-index:5;display:flex;gap:15px}a{color:#efd0a4}section{padding:24px 0;border-top:1px solid #555;scroll-margin-top:60px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}.reference,.stage{width:100%;aspect-ratio:var(--ratio);position:relative;overflow:hidden}.reference img{width:100%;height:100%;object-fit:contain}.stage,.asset-view{background-color:#bbb;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage img{position:absolute;width:100%;height:100%;object-fit:fill;inset:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px}article{padding:14px;background:#26262c;border-radius:10px}article h3{font-size:16px;margin:5px 0}.asset-view{height:320px;display:flex;align-items:center;justify-content:center}.asset-view img{width:100%;height:100%;object-fit:contain}small{display:block;color:#bbb;margin:8px 0}.warn{color:#ffce8a}.toolbar{margin:12px 0;display:flex;gap:12px;flex-wrap:wrap}button,select{background:#35353c;color:white;border:1px solid #777;padding:8px;border-radius:6px}label{display:block;margin:6px 0}.notes{white-space:pre-line}.stage-title{margin-bottom:8px}@media(max-width:650px){main{padding:14px}.compare{gap:8px}.asset-view{height:260px}}
</style><main><h1>Vídeo 174 · Recortes das quatro cenas</h1><p>Revisão dos componentes antes da montagem do vídeo. Referências e recortes identificados por cena. A aprovação dos recortes será registrada após sua confirmação no chat.</p><p id="status" class="warn"></p><nav id="nav"></nav><div id="scenes"></div></main>
<script>
const data=__CUTOUT_DATA__;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
document.querySelector('#status').textContent=data.status;
for(const scene of data.scenes){
 const link=el('a',scene.title);link.href='#'+scene.id;link.onclick=()=>document.getElementById(scene.id).scrollIntoView();document.querySelector('#nav').append(link);
 const sec=el('section');sec.id=scene.id;sec.style.setProperty('--ratio',scene.width+'/'+scene.height);sec.append(el('h2',scene.title),el('p',scene.palette),el('p',scene.notes,'notes warn'));
 const compare=el('div',null,'compare');const ref=el('div');ref.append(el('div','Referência escolhida','stage-title'));const rf=el('div',null,'reference');const ri=el('img');ri.src=scene.source;ri.alt=scene.title+' referência';rf.append(ri);ref.append(rf);compare.append(ref);
 const composed=el('div');composed.append(el('div','Sobreposição de conferência · não aprovada','stage-title'));const stage=el('div',null,'stage');composed.append(stage);compare.append(composed);sec.append(compare);
 const toolbar=el('div',null,'toolbar');const select=el('select');for(const [value,name] of [['checker','Quadriculado'],['#fff','Fundo branco'],['#111','Fundo escuro']]){const o=el('option',name);o.value=value;select.append(o)}select.onchange=()=>{for(const v of sec.querySelectorAll('.stage,.asset-view')){v.style.backgroundImage=select.value==='checker'?'':'none';v.style.backgroundColor=select.value==='checker'?'':select.value}};toolbar.append(select);sec.append(toolbar);
 const grid=el('div',null,'grid');for(const asset of scene.assets){const layer=el('img');layer.src=asset.compositeSrc||asset.src;layer.dataset.assetId=asset.id;layer.alt=asset.label;stage.append(layer);if(asset.fragments?.length){layer.style.display='none';const group=el('div');for(const f of asset.fragments){const box=el('div');box.style.cssText=`position:absolute;overflow:hidden;left:${f.target[0]/scene.width*100}%;top:${f.target[1]/scene.height*100}%;width:${f.target[2]/scene.width*100}%;height:${f.target[3]/scene.height*100}%`;const part=el('img');part.src=asset.src;part.alt=asset.label;part.style.cssText=`position:absolute;max-width:none;width:${asset.imageWidth/f.crop[2]*100}%;height:${asset.imageHeight/f.crop[3]*100}%;left:${-f.crop[0]/f.crop[2]*100}%;top:${-f.crop[1]/f.crop[3]*100}%;object-fit:fill`;box.append(part);group.append(box)}stage.append(group);layer._fragmentGroup=group;}if(asset.transform)layer.style.transform=asset.transform;layer.style.transformOrigin='0 0';const card=el('article');const lab=el('label');const check=el('input');check.type='checkbox';check.dataset.stage=asset.stage;check.checked=true;check.onchange=()=>{layer.hidden=!check.checked;for(const dependent of scene.assets.filter(a=>a.occludedBy===asset.id)){const dl=stage.querySelector('[data-asset-id="'+dependent.id+'"]');if(dl)dl.src=check.checked?dependent.compositeSrc:dependent.src;}if(layer._fragmentGroup)layer._fragmentGroup.hidden=!check.checked};lab.append(check,document.createTextNode(' Mostrar na sobreposição'));card.append(el('h3',asset.label),el('small',asset.id),el('small',asset.stage),lab);const av=el('div',null,'asset-view');const im=el('img');im.src=asset.previewSrc||asset.src;im.alt=asset.label;av.append(im);card.append(av,el('p',asset.notes||'Aguardando revisão.','warn'));const a=el('a','Abrir PNG');a.href=asset.src;a.target='_blank';card.append(a);grid.append(card)}sec.append(grid);const stages=[...new Set(scene.assets.map(a=>a.stage))];const ordered=scene.stageOrder||stages;for(let i=0;i<ordered.length;i++){const b=el('button',(i+1)+' · '+ordered[i]);b.onclick=()=>{for(const c of grid.querySelectorAll('input[type=checkbox]')){c.checked=ordered.indexOf(c.dataset.stage)<=i;c.dispatchEvent(new Event('change'));}};toolbar.append(b);}document.querySelector('#scenes').append(sec);
}
</script></html>
