<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vídeo completo</title><style>*{box-sizing:border-box}body{margin:0;background:#141416;color:#f5f3f0;font:16px system-ui}main{max-width:1160px;margin:auto;padding:26px}h1{font-size:28px;margin:0 0 10px}p{color:#bbb;line-height:1.5}.layout{display:grid;grid-template-columns:minmax(240px,440px) 1fr;gap:28px}video{width:100%;max-height:85vh;background:#000;border-radius:12px}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{color:inherit;background:#25252a;border:1px solid #45454c;border-radius:12px;padding:10px;cursor:pointer;text-align:left;font:inherit}button:hover{border-color:#e3caa4}button img{display:block;width:100%;max-height:220px;object-fit:contain;margin-bottom:8px}small{color:#bbb;display:block;margin-top:5px}a{color:#e3caa4}.note{border-left:2px solid #e3caa4;padding-left:14px;margin:22px 0}@media(max-width:700px){.layout{display:block}.scenes{margin-top:18px}video{max-height:75vh}} </style><main><h1 id="title"></h1><p id="summary"></p><div class="layout"><video id="player" controls playsinline preload="metadata"></video><div><div id="scenes" class="scenes"></div><p class="note" id="checkpoint-note"></p><p>Ao voltar, assista com som e indique no chat os ajustes desejados. Você também pode revisar girl e boy separadamente em cada cena.</p><p><a id="download" download>Baixar vídeo completo</a> · <a href="review-notes.html">O que foi aplicado e conferido</a></p></div></div></main><script>const data=__REVIEW_DATA__;document.title=data.title;document.querySelector('#checkpoint-note').textContent=data.checkpointNote||'Montagem disponível para revisão. A aprovação da exportação exata continua pendente.';document.querySelector('#title').textContent=data.title;document.querySelector('#summary').textContent=data.summary;const v=document.querySelector('#player');v.src=data.src;document.querySelector('#download').href=data.src;for(const scene of data.scenes){const b=document.createElement('button');const image=document.createElement('img');image.src=scene.poster;image.alt=scene.label;b.append(image);b.append(document.createTextNode(scene.label));const small=document.createElement('small');small.textContent=scene.description;b.append(small);b.onclick=()=>{v.currentTime=scene.start;v.play()};document.querySelector('#scenes').append(b)}</script></html>
